<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">M4 - Consulta e Informes</text>
  <text x="400" y="65" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">Query & Reporting Module</text>
  
  <g font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
      </marker>
    </defs>
    
    <!-- Main components -->
    <rect x="300" y="40" width="200" height="50" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="400" y="65" text-anchor="middle">🔍 Consulta e Informes</text>
    
    <line x1="400" y1="90" x2="400" y2="110" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- EstabCargados Matrix -->
    <rect x="200" y="130" width="150" height="70" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <text x="275" y="155" text-anchor="middle" font-weight="bold">🏢 EstabCargados</text>
    <text x="275" y="170" text-anchor="middle">Matriz mensual</text>
    <text x="275" y="180" text-anchor="middle">Ene-Dic</text>
    
    <rect x="450" y="130" width="150" height="70" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <text x="525" y="155" text-anchor="middle" font-weight="bold">🔴 Duplicidad</text>
    <text x="525" y="170" text-anchor="middle">GROUP BY + HAVING</text>
    <text x="525" y="180" text-anchor="middle">COUNT > 1</text>
    
    <line x1="400" y1="200" x2="400" y2="220" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Prestacion search -->
    <rect x="200" y="240" width="150" height="70" rx="8" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
    <text x="275" y="265" text-anchor="middle" font-weight="bold">💊 Prestacion</text>
    <text x="275" y="280" text-anchor="middle">Búsqueda por código</text>
    <text x="275" y="290" text-anchor="middle">col01-col50</text>
    
    <rect x="450" y="240" width="150" height="70" rx="8" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
    <text x="525" y="265" text-anchor="middle" font-weight="bold">📈 Comparativos</text>
    <text x="525" y="280" text-anchor="middle">Por año/mes</text>
    <text x="525" y="290" text-anchor="middle">Variaciones</text>
    
    <line x1="400" y1="310" x2="400" y2="330" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Informe1 -->
    <rect x="300" y="350" width="200" height="60" rx="8" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
    <text x="400" y="375" text-anchor="middle" font-weight="bold">📄 Informe1</text>
    <text x="400" y="395" text-anchor="middle">Consolidación MINSAL</text>
    
    <!-- Data source -->
    <line x1="400" y1="410" x2="400" y2="430" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="300" y="440" width="200" height="40" rx="8" fill="#27ae60" stroke="#2ecc71" stroke-width="2"/>
    <text x="400" y="465" text-anchor="middle" font-weight="bold">💾 BASE datos.mdb</text>
    
    <!-- Export options -->
    <line x1="200" y1="480" x2="400" y2="480" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="600" y1="480" x2="400" y2="480" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="100" y="500" width="200" height="50" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="200" y="525" text-anchor="middle">📥 Exportar a Excel</text>
    
    <rect x="500" y="500" width="200" height="50" rx="8" fill="#27ae60" stroke="#2ecc71" stroke-width="2"/>
    <text x="600" y="525" text-anchor="middle">📤 Descarga/Compartir</text>
  </g>
  
  <rect x="50" y="580" width="150" height="80" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="125" y="600" text-anchor="middle" font-size="12" font-weight="bold">📊 Volumen</text>
  <text x="125" y="620" text-anchor="middle" font-size="11">15,000+ filas</text>
  <text x="125" y="635" text-anchor="middle" font-size="11">602 establecimientos</text>
  
  <rect x="600" y="580" width="150" height="80" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="675" y="600" text-anchor="middle" font-size="12" font-weight="bold">📁 Tablas</text>
  <text x="675" y="620" text-anchor="middle" font-size="11">cargados, temporal</text>
  <text x="675" y="635" text-anchor="middle" font-size="11">INF1 generado</text>
</svg>