<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">M5 - Mantenimiento y Exportación</text>
  <text x="400" y="65" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">Data Maintenance Flow</text>
  
  <g font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
      </marker>
    </defs>
    
    <!-- Start -->
    <rect x="300" y="40" width="200" height="50" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="400" y="65" text-anchor="middle">🗑️ Mantenimiento & Exportar</text>
    
    <!-- Sub-flows -->
    <line x1="400" y1="90" x2="400" y2="110" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Eliminar -->
    <rect x="150" y="130" width="150" height="60" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="225" y="150" text-anchor="middle" font-weight="bold">🗑️ Eliminar</text>
    <text x="225" y="165" text-anchor="middle">Borrado selectivo</text>
    
    <rect x="450" y="130" width="150" height="60" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="525" y="150" text-anchor="middle" font-weight="bold">⚡ Optimiza</text>
    <text x="525" y="165" text-anchor="middle">Compactar bases</text>
    
    <line x1="400" y1="190" x2="400" y2="210" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Export -->
    <rect x="300" y="230" width="200" height="60" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <text x="400" y="255" text-anchor="middle" font-weight="bold">📤 Exportar</text>
    <text x="400" y="275" text-anchor="middle">DBF / MINSAL</text>
    
    <!-- Detailed flows -->
    <line x1="400" y1="290" x2="200" y2="310" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="400" y1="290" x2="400" y2="310" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="400" y1="290" x2="600" y2="310" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Eliminar detalle -->
    <rect x="100" y="340" width="180" height="80" rx="8" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
    <text x="190" y="360" text-anchor="middle" font-weight="bold">➡️ Eliminar</text>
    <text x="190" y="375" text-anchor="middle">1. Seleccionar año/mes/sera/e</text>
    <text x="190" y="388" text-anchor="middle">2. Confirmar borrado</text>
    <text x="190" y="398" text-anchor="middle">3. Borrado cascada</text>
    
    <!-- Optimiza detalle -->
    <rect x="310" y="340" width="180" height="80" rx="8" fill="#27ae60" stroke="#2ecc71" stroke-width="2"/>
    <text x="400" y="360" text-anchor="middle" font-weight="bold">⚡ Optimiza</text>
    <text x="400" y="375" text-anchor="middle">Compactar .mdb</text>
    <text x="400" y="388" text-anchor="middle">JRO.CompactDatabase</text>
    <text x="400" y="398" text-anchor="middle">2-5 minutos</text>
    
    <!-- Export detalle -->
    <rect x="520" y="340" width="180" height="80" rx="8" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
    <text x="610" y="360" text-anchor="middle" font-weight="bold">📤 Exportar</text>
    <text x="610" y="375" text-anchor="middle">→ DBF: dBase III</text>
    <text x="610" y="388" text-anchor="middle">→ MINSAL: GZip</text>
    
    <line x1="610" y1="420" x2="610" y2="440" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="510" y="450" width="280" height="60" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
    <text x="650" y="475" text-anchor="middle" font-weight="bold">✅ Mensaje Éxito</text>
    <text x="650" y="495" text-anchor="middle">"'Archivo generado...'"</text>
    
    <line x1="400" y1="510" x2="400" y2="530" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
    <rect x="300" y="540" width="200" height="50" rx="8" fill="#2c3e50" fill-opacity="0.8" stroke="none"/>
    <text x="400" y="565" text-anchor="middle" fill="white">Mensajes de salida:</text>
    <text x="400" y="580" text-anchor="middle" fill="white" font-size="11">Éxito, Error, Cancelado</text>
  </g>
  
  <rect x="50" y="600" width="150" height="80" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="125" y="620" text-anchor="middle" font-size="12" font-weight="bold">📁 Archivos</text>
  <text x="125" y="640" text-anchor="middle" font-size="11">GLOBAL.mdb (422MB)</text>
  <text x="125" y="655" text-anchor="middle" font-size="11">DatosSERIE.mdb</text>
  
  <rect x="600" y="600" width="150" height="80" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="675" y="620" text-anchor="middle" font-size="12" font-weight="bold">⏱️ Tiempo</text>
  <text x="675" y="640" text-anchor="middle" font-size="11">Comp: 2-5 min</text>
  <text x="675" y="655" text-anchor="middle" font-size="11">Export: variable</text>
</svg>